name: Build and test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Build
        run: |
          git init
          git fetch --no-tags --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          jobs=$(getconf _NPROCESSORS_ONLN) || jobs=1
          make -j "$jobs" all
      - name: Test
        run: ./Tools/run-unit-checks.sh
