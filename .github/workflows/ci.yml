name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (10 second budget)
    runs-on: macos-15
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run unit tests within 10 seconds
        run: ./Tools/run-unit-checks.sh
